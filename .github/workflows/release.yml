name: Release (build Demo DMG)

# MANUAL ONLY — this workflow never publishes a GitHub release and never runs on
# a tag push. Pushing a tag does NOT create or upload anything.
#
# Why: the shipped app (FlipStack.app) is the ad-hoc-signed receipt Demo from
# Demo/, NOT the root Sources/FlipStack app. There are no Apple Developer
# secrets in this repository, so notarization is impossible; a tag-triggered
# notarized build would fail (or, worse, publish the wrong app).
#
# Canonical releases are cut locally on the maintainer Mac (see README
# "Release process"):
#   MARKETING_VERSION=1.0.2 BUILD_NUMBER=13 Scripts/bundle-demo.sh --dmg
#   git tag -a v1.0.2 -m "FlipStack 1.0.2 (build 13)"
#   git push origin v1.0.2
#   gh release create v1.0.2 --verify-tag --title "FlipStack 1.0.2 (build 13)" \
#     --notes-file release-notes-1.0.2.md \
#     dist-demo/FlipStack.dmg dist-demo/FlipStack.dmg.sha256
#
# This workflow re-runs the same build on a clean GitHub runner (proving the
# pipeline) and uploads the signed DMG + sha256 as workflow artifacts. A human
# decides what to publish.

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "MARKETING_VERSION override (leave empty to use Demo/version.env)"
        required: false
        type: string
      build_number:
        description: "BUILD_NUMBER override (leave empty to use Demo/version.env)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-demo
  cancel-in-progress: false

jobs:
  demo-dmg:
    name: Build, test and package the Demo app
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show tool versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: Demo/.build
          key: ${{ runner.os }}-${{ runner.arch }}-release-demo-${{ hashFiles('Demo/Package.swift', 'Package.swift', 'Demo/version.env') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-release-demo-

      - name: Resolve version
        id: version
        env:
          INPUT_MARKETING_VERSION: ${{ inputs.marketing_version }}
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          # Demo/version.env is the single source of truth; the inputs are escape hatches.
          set -a
          # shellcheck disable=SC1091
          . Demo/version.env
          set +a
          version="${INPUT_MARKETING_VERSION:-$MARKETING_VERSION}"
          build="${INPUT_BUILD_NUMBER:-$BUILD_NUMBER}"
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "error: bad MARKETING_VERSION: $version" >&2
            exit 1
          fi
          if [[ ! "$build" =~ ^[0-9]+$ ]]; then
            echo "error: bad BUILD_NUMBER: $build" >&2
            exit 1
          fi
          {
            echo "version=$version"
            echo "build=$build"
          } >> "$GITHUB_OUTPUT"
          echo "Packaging FlipStack $version (build $build)"

      - name: Run Demo tests
        run: cd Demo && swift test --parallel

      - name: Build and package the DMG (ad-hoc signed)
        env:
          MARKETING_VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
        run: Scripts/bundle-demo.sh --dmg

      - name: Verify the DMG
        run: |
          set -euo pipefail
          APP="dist-demo/FlipStack.app"
          DMG="dist-demo/FlipStack.dmg"
          test -x "$APP/Contents/MacOS/FlipStack"
          test -f "$APP/Contents/Resources/AppIcon.icns"
          test -f "$APP/Contents/Resources/menuicon.png"
          codesign --verify --deep --strict --verbose=2 "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist" | grep -qx 'app.flipstack.FlipStack'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist" | grep -qx 'FlipStack'
          /usr/libexec/PlistBuddy -c 'Print :LSUIElement' "$APP/Contents/Info.plist" | grep -qx 'true'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist" \
            | grep -Fx "${{ steps.version.outputs.version }}"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Contents/Info.plist" \
            | grep -Fx "${{ steps.version.outputs.build }}"
          plutil -lint "$APP/Contents/Info.plist"
          lipo -info "$APP/Contents/MacOS/FlipStack" | grep -q 'arm64'
          ( cd dist-demo && shasum -a 256 -c FlipStack.dmg.sha256 )
          # The app inside the mounted DMG must still carry a valid signature.
          mkdir -p "$RUNNER_TEMP/release-mnt"
          hdiutil attach -readonly -nobrowse -mountpoint "$RUNNER_TEMP/release-mnt" "$DMG"
          test -d "$RUNNER_TEMP/release-mnt/FlipStack.app"
          test -L "$RUNNER_TEMP/release-mnt/Applications"
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/release-mnt/FlipStack.app"
          hdiutil detach "$RUNNER_TEMP/release-mnt"

      - name: Upload DMG + sha256 (workflow artifact — NOT a GitHub release)
        uses: actions/upload-artifact@v4
        with:
          name: FlipStack-${{ steps.version.outputs.version }}-build${{ steps.version.outputs.build }}-${{ github.sha }}
          path: |
            dist-demo/FlipStack.dmg
            dist-demo/FlipStack.dmg.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        run: |
          {
            echo "## FlipStack ${{ steps.version.outputs.version }} (build ${{ steps.version.outputs.build }})"
            echo
            echo "Ad-hoc signed, **not notarized**. This run only proves the pipeline and"
            echo "uploads a workflow artifact; canonical releases are published manually from"
            echo "a maintainer Mac with \`gh release create\`."
            echo
            echo "```"
            cat dist-demo/FlipStack.dmg.sha256
            echo "```"
          } >> "$GITHUB_STEP_SUMMARY"
